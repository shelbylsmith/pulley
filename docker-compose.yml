services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulley
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulley}
      POSTGRES_DB: pulley
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulley"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: ${PULLEY_IMAGE:-ghcr.io/shelbylsmith/pulley:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pulley:${POSTGRES_PASSWORD:-pulley}@db:5432/pulley
      SCHEDULER_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
