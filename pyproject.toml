[project]
name = "pulley"
version = "0.1.0"
description = "Bidirectional GitHub-Slack PR integration — ephemeral channels, review sync, CI/CD notifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "slack-sdk>=3.33,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "cryptography>=44,<45",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.18,<1",
    "aiohttp>=3.11,<4",
    "mistune>=3.0,<4",
    "emoji>=2,<3",
    "croniter>=6.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
    "httpx>=0.28,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
